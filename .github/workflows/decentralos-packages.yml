name: DecentralOS packages

# Builds the DecentralOS pacman repository (node package plus our builds of the
# OS packages) and publishes it as the assets of the `packages` release, which
# is what the [decentralos] pacman repository on every device points at.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: decentralos-packages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo github-cli jq imagemagick neovim nodejs npm tree-sitter-cli
          useradd -m build
          echo "build ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/build
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chown -R build .
          sudo -u build git config --global --add safe.directory '*'
          sudo -u build --preserve-env=GH_TOKEN bash decentralos/pkg/build-repo.sh /home/build/repo
      - name: Publish repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /home/build/repo
          # Release assets can't be symlinks; pacman asks for decentralos.db.
          for f in decentralos.db decentralos.files; do cp --remove-destination "$(readlink -f $f)" $f; done
          gh release view packages -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create packages -R "$GITHUB_REPOSITORY" --title "Package repository" --notes "pacman repository for DecentralOS. Not a versioned release."
          gh release upload packages -R "$GITHUB_REPOSITORY" --clobber decentralos.db decentralos.files *.pkg.tar.zst
          # Drop packages the new database no longer lists.
          for asset in $(gh release view packages -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "$asset" ] || gh release delete-asset packages "$asset" -R "$GITHUB_REPOSITORY" --yes
          done
